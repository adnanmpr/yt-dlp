# Fork auto-sync — copy to .github/workflows/sync-fork.yml in EACH fork.
# The SAME file works for every fork: `gh repo sync` follows the fork's own
# upstream automatically, so no per-repo edits are needed.
# Runs daily (~07:00 PKT) + manually from the Actions tab (workflow_dispatch).
# If the fork ever has local commits that conflict with upstream, the run
# fails safely (nothing is force-pushed) — resolve manually, then re-run.
# NOTE: scheduled workflows stop running if the repo is inactive for 60 days;
# a manual run from the Actions tab re-arms them.
name: Sync fork with upstream

on:
  schedule:
    - cron: '0 2 * * *'  # daily, ~07:00 PKT
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync
